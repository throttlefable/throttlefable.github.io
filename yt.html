<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Throttle Fable on YouTube</title>
<meta property="og:title" content="Throttle Fable on YouTube">
<meta property="og:description" content="Every car has a story. We turn the key and listen.">
<meta property="og:image" content="https://throttlefable.github.io/logo.png">
<link rel="icon" href="logo.png">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0e0f12; color: #e9e9ec; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { text-align: center; padding: 24px 16px; max-width: 360px; }
  img { width: 96px; height: 96px; border-radius: 50%; }
  h1 { font-size: 20px; margin: 16px 0 4px; }
  p { color: #a4a6ad; margin: 0 0 20px; }
  a.btn { display: block; padding: 14px 18px; border-radius: 12px; background: #e62117; color: #fff;
          text-decoration: none; font-weight: 600; margin-bottom: 10px; }
  a.alt { display: block; color: #a4a6ad; font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Throttle Fable">
  <h1>Throttle Fable</h1>
  <p>Opening YouTube…</p>
  <a class="btn" id="app" href="https://www.youtube.com/@ThrottleFable">Open in YouTube app</a>
  <a class="alt" href="https://www.youtube.com/@ThrottleFable">Continue in browser</a>
</main>
<script>
(function () {
  var web = "https://www.youtube.com/@ThrottleFable";
  var ua = navigator.userAgent || "";
  var app = null;
  if (/android/i.test(ua)) {
    app = "intent://www.youtube.com/@ThrottleFable#Intent;scheme=https;package=com.google.android.youtube;" +
          "S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
  } else if (/iphone|ipad|ipod/i.test(ua)) {
    app = "youtube://www.youtube.com/@ThrottleFable";
  }
  if (!app) { location.replace(web); return; }
  document.getElementById("app").href = app;
  location.href = app;
  // Uygulama açılmadıysa (sayfa hâlâ görünür) web sayfasına geç.
  setTimeout(function () { if (!document.hidden) location.href = web; }, 2000);
})();
</script>
</body>
</html>
